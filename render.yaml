services:
  - type: web
    name: atomshop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PAYMENT_MODE
        value: test
      - key: RCON_HOST
        sync: false
      - key: RCON_PORT
        value: 25575
      - key: RCON_PASSWORD
        sync: false
